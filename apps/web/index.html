<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="description" content="Закрытое сообщество" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beacon" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Beacon</title>
    <style>
      html, body { background: #f7f8fb; color-scheme: light; }
      .startup-screen {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #f7f8fb;
        color: #17215b;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .startup-screen h1 { margin: 0; font-size: 24px; font-weight: 650; }
      .startup-screen p { margin: 0; color: #667085; font-size: 14px; }
      .startup-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(49, 88, 213, 0.2);
        border-top-color: #3158d5;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .startup-spinner { animation: none; } }
    </style>
  </head>
  <body class="capture">
    <div id="root">
      <main class="startup-screen" role="status" aria-live="polite">
        <span class="startup-spinner" aria-hidden="true"></span>
        <h1>Beacon</h1>
        <p>Загружаем приложение…</p>
      </main>
    </div>
    <noscript>
      <style>#root { display: none; }</style>
      <main class="startup-screen">
        <h1>Beacon</h1>
        <p>Для работы приложения включите JavaScript в браузере.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
